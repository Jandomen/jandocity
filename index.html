<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="format-detection" content="telephone=no" />
  <title>Jandocity</title>
  <link rel="icon" type="image/png" href="/favicon.png" />
  <link rel="apple-touch-icon" href="/pwa-192x192.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@800;900&family=Righteous&display=swap" rel="stylesheet">
  <style>
    * { -webkit-tap-highlight-color: transparent; }
    html { overscroll-behavior: none; }
    body { overscroll-behavior: none; touch-action: manipulation; text-rendering: optimizeSpeed; -webkit-font-smoothing: antialiased; }
    #app { contain: layout style; }
    @media (max-width: 768px) {
      * { animation-duration: 0.5s !important; }
    }
  </style>
</head>
<body class="bg-slate-900 text-white">
  <div id="app"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
